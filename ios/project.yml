name: NBAStats
options:
  bundleIdPrefix: nz.jaredbro
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NBAStats:
    type: application
    platform: iOS
    sources:
      - NBAStats
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.jaredbro.nbastats
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NBAStats/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NBA Stats
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Finds NBA Stats on your Mac to copy its data over Wi-Fi.
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
